# =============================================================================
# Traefik Dynamic Configuration - TLS Options
# =============================================================================
# TLS hardening options. These apply regardless of certificate source.
# When no custom certificates are configured, Traefik uses its built-in
# self-signed certificate (regenerated on each container restart).
#
# To use persistent self-signed certificates, run:
#   ./scripts/generate-certs.sh
#
# This will generate certificates and create the certs.yml dynamic config
# file that tells Traefik to use them.

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: false

    modern:
      minVersion: VersionTLS13
      sniStrict: false
